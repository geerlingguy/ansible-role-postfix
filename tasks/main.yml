---
- name: Postfix | Ensure postfix is installed.
  ansible.builtin.package:
    name: postfix
    state: present
  tags: postfix

- name: Postfix | Update Postfix configuration.
  ansible.builtin.lineinfile:
    dest: "{{ postfix_config_file }}"
    line: "{{ item.name }} = {{ item.value }}"
    regexp: "^{{ item.name }} ="
    mode: "0644"
  with_items:
    - name: inet_interfaces
      value: "{{ postfix_inet_interfaces }}"
    - name: inet_protocols
      value: "{{ postfix_inet_protocols }}"
  notify: restart postfix
  tags: postfix 

- name: Postfix | Ensure postfix is started and enabled at boot.
  ansible.builtin.service:
    name: postfix
    state: "{{ postfix_service_state }}"
    enabled: "{{ postfix_service_enabled }}"
  tags: postfix
